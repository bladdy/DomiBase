name: domibase

services:
  postgres:
    image: postgres:18-alpine
    container_name: domibase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_CONTROL_DB:-domibase_control}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${DOMIBASE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - domibase_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - domibase

networks:
  domibase:
    name: domibase_net
    driver: bridge

volumes:
  domibase_postgres_data:
    name: domibase_postgres_data
