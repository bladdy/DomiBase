name: domibase

services:
  postgres:
    image: postgres:18-alpine
    container_name: domibase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_CONTROL_DB:-domibase_control}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${DOMIBASE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - domibase_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - domibase

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    image: domibase-api:local
    container_name: domibase-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      CONTROL_DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_CONTROL_DB:-domibase_control};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PROVISIONING_DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=postgres;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      RUNTIME_DB_HOST: postgres
      RUNTIME_DB_PORT: "5432"
      DOMIBASE_CORS_ORIGINS: "http://localhost:4325,http://127.0.0.1:5190"
      STORAGE_ROOT: /app/storage
      BACKUP_ROOT: /app/backups
    ports:
      - "127.0.0.1:${DOMIBASE_API_PORT:-5080}:8080"
    volumes:
      - domibase_storage:/app/storage
      - domibase_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - domibase

  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    image: domibase-admin:local
    container_name: domibase-admin
    restart: unless-stopped
    environment:
      CONTROL_API_TARGET: http://api:8080
    ports:
      - "127.0.0.1:${DOMIBASE_ADMIN_PORT:-5190}:5190"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - domibase

networks:
  domibase:
    name: domibase_net
    driver: bridge

volumes:
  domibase_postgres_data:
    name: domibase_postgres_data
  domibase_storage:
    name: domibase_storage
  domibase_backups:
    name: domibase_backups
